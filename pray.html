  <main id="main" class="pray">
    <h1 class="visually-hidden">Pray the rosary online, step by step</h1>
    <div class="beads-pane"><div class="beads" id="beads"></div></div>

    <section class="guide" aria-label="Guided rosary">
      <div class="lang-picker" id="lang-picker" role="group" aria-label="Language of the prayers"></div>
      <div class="set-picker" id="set-picker" role="group" aria-label="Choose the mysteries"></div>
      <div class="view-options" role="group" aria-label="Display options">
        <button type="button" class="chip" id="text-smaller" aria-label="Smaller text">A−</button>
        <button type="button" class="chip" id="text-larger" aria-label="Larger text">A+</button>
        <button type="button" class="chip" id="words-only" aria-pressed="false">Words only</button>
        <button type="button" class="chip" id="awake" aria-pressed="true">Keep screen on</button>
      </div>
      <div class="progress">
        <div class="bar" id="bar" role="progressbar" aria-label="Rosary progress" aria-valuemin="0" aria-valuemax="100"><span id="bar-fill"></span></div>
        <p id="step-count"></p>
      </div>
      <article class="card" id="card" aria-live="polite"></article>
      <div class="controls">
        <button type="button" class="btn ghost" id="back">Back</button>
        <button type="button" class="btn" id="next">Next</button>
      </div>
      <noscript><p>The guided rosary needs JavaScript.</p></noscript>
    </section>
  </main>
